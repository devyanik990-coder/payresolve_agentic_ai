<!DOCTYPE html>
<!--
  =====================================================================
  PayResolve AI — queue-preview.html  (LOCAL PREVIEW / VIEWING AID ONLY)
  Phase 5.1 — Investigation Queue Layout
  ---------------------------------------------------------------------
  Why this file exists:
    The real application (index.html) is a modular ES-module app, and
    browsers BLOCK ES modules over the file:// protocol (double-click).
    This standalone page uses a single CLASSIC (non-module) script so you
    can DOUBLE-CLICK it and see the Phase 5.1 Investigation Queue layout
    in all three presentation states: Ready (placeholder rows), Empty, and
    Loading.

  Important:
    - This is a VIEWING AID that mirrors the approved modular components in
      src/queue/ (InvestigationQueueScreen → QueueHeader, QueueSummary,
      QueueList → QueueRow, QueueEmptyState, QueueLoadingState, QueueFooter).
      It is NOT the application architecture.
    - The canonical implementation lives unchanged in src/queue/. The
      real app is served over http:// (see index.html / the note below).
    - It reuses the real stylesheet (assets/css/styles.css).
    - Layout only: no data, no state, no selection, no loading — exactly
      as Phase 5.1 requires.
  =====================================================================
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PayResolve AI — Investigation Queue Preview</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="app-root">
      <header id="app-header" class="app-header">
        <div class="app-header__brand">
          <span class="app-header__logo" aria-hidden="true">PR</span>
          <div class="app-header__titles">
            <h1 class="app-header__title">PayResolve AI</h1>
            <p class="app-header__subtitle">Agentic Payment Operations Investigation Platform</p>
          </div>
        </div>
        <div class="app-header__meta">Investigation Queue — Local Preview (Phase 5.1)</div>
      </header>

      <main id="screen-outlet" class="screen-outlet" aria-live="polite"></main>
    </div>

    <!--
      Classic (non-module) mirror of the src/queue/ components. Output is a
      faithful copy of the modular render so the layout can be viewed on
      double-click. Presentation only — no state, no data, no behaviour.
    -->
    <script>
      (function () {
        "use strict";

        var PH = "—"; // placeholder token (matches queueRow.js)

        // Shared column definitions (mirrors queueRow.js QUEUE_COLUMNS).
        var COLUMNS = [
          { key: "caseId", label: "Case ID" },
          { key: "merchant", label: "Merchant" },
          { key: "gateway", label: "Gateway" },
          { key: "network", label: "Network" },
          { key: "failureCategory", label: "Failure Category" },
          { key: "priority", label: "Priority" },
          { key: "amount", label: "Revenue at Risk" },
          { key: "failedTransactions", label: "Failed Txns" },
          { key: "status", label: "Status" },
          { key: "createdDate", label: "Created" }
        ];

        var pill = '<span class="queue-pill queue-pill--placeholder">' + PH + "</span>";

        function queueRow() {
          return (
            '<div class="queue-row" role="row" data-queue-row data-case-id="" tabindex="-1" aria-disabled="true">' +
            '<span class="queue-cell queue-cell--id" role="cell" data-col="caseId">' + PH + "</span>" +
            '<span class="queue-cell queue-cell--merchant" role="cell" data-col="merchant">' + PH + "</span>" +
            '<span class="queue-cell queue-cell--gateway" role="cell" data-col="gateway">' + PH + "</span>" +
            '<span class="queue-cell queue-cell--network" role="cell" data-col="network">' + PH + "</span>" +
            '<span class="queue-cell queue-cell--category" role="cell" data-col="failureCategory">' + PH + "</span>" +
            '<span class="queue-cell queue-cell--priority" role="cell" data-col="priority">' + pill + "</span>" +
            '<span class="queue-cell queue-cell--amount" role="cell" data-col="amount">' + PH + "</span>" +
            '<span class="queue-cell queue-cell--txns" role="cell" data-col="failedTransactions">' + PH + "</span>" +
            '<span class="queue-cell queue-cell--status" role="cell" data-col="status">' + pill + "</span>" +
            '<span class="queue-cell queue-cell--created" role="cell" data-col="createdDate">' + PH + "</span>" +
            "</div>"
          );
        }

        function headerRow() {
          var cells = COLUMNS.map(function (c) {
            return '<span class="queue-cell queue-head-cell" role="columnheader" data-col="' + c.key + '">' + c.label + "</span>";
          }).join("");
          return '<div class="queue-row queue-row--head" role="row">' + cells + "</div>";
        }

        function emptyState() {
          return (
            '<div class="queue-empty" role="status" data-state="empty">' +
            '<div class="queue-empty__glyph" aria-hidden="true">▢</div>' +
            '<h4 class="queue-empty__title">No investigation cases available</h4>' +
            '<p class="queue-empty__text">There are currently no cases in this queue to display.</p>' +
            "</div>"
          );
        }

        function loadingState() {
          var rows = "";
          for (var i = 0; i < 5; i += 1) {
            rows += '<div class="queue-skeleton__row" aria-hidden="true"><span class="queue-skeleton__bar"></span></div>';
          }
          return (
            '<div class="queue-loading" role="status" aria-live="polite" data-state="loading">' +
            '<p class="queue-loading__label">Preparing the investigation queue…</p>' +
            '<div class="queue-skeleton">' + rows + "</div></div>"
          );
        }

        function queueList(presentation) {
          var body;
          if (presentation === "empty") body = emptyState();
          else if (presentation === "loading") body = loadingState();
          else {
            body = "";
            for (var i = 0; i < 6; i += 1) body += queueRow();
          }
          return (
            '<section class="queue-list" aria-label="Investigation cases" data-presentation="' + presentation + '">' +
            '<div class="queue-table" role="table" aria-label="Investigation Table">' +
            '<div class="queue-thead" role="rowgroup">' + headerRow() + "</div>" +
            '<div class="queue-scroll" role="rowgroup" tabindex="0" aria-label="Scrollable case list">' + body + "</div>" +
            "</div></section>"
          );
        }

        function queueHeader() {
          function inert(label) {
            return '<button type="button" class="queue-control" disabled aria-disabled="true" tabindex="-1">' + label + "</button>";
          }
          return (
            '<header class="queue-header" data-region="queue-header">' +
            '<div class="queue-header__context">' +
            '<button type="button" class="queue-back" disabled aria-disabled="true" tabindex="-1" aria-label="Return to Dashboard">←</button>' +
            '<div class="queue-header__titles">' +
            '<p class="queue-header__eyebrow">Investigation Queue</p>' +
            '<h3 class="queue-header__category" data-field="selectedCategory">' + PH + "</h3>" +
            '<p class="queue-header__window">Selection window: <span data-field="window">' + PH +
            '</span> &nbsp;·&nbsp; Last updated: <span data-field="lastUpdated">' + PH + "</span></p>" +
            "</div></div>" +
            '<div class="queue-header__controls" role="group" aria-label="Queue controls (inactive in this phase)">' +
            '<div class="queue-search"><input type="search" class="queue-search__input" placeholder="Search cases" disabled aria-disabled="true" tabindex="-1" aria-label="Search cases" /></div>' +
            inert("Filters") + inert("Sort") + inert("Refresh") +
            "</div></header>"
          );
        }

        function queueSummary() {
          var figures = [
            { key: "total", label: "Total Cases" },
            { key: "critical", label: "Critical" },
            { key: "high", label: "High" },
            { key: "normal", label: "Normal" },
            { key: "revenueAtRisk", label: "Revenue at Risk" }
          ];
          var tiles = figures.map(function (f) {
            return '<article class="queue-summary__tile" data-figure="' + f.key + '">' +
              '<p class="queue-summary__value">' + PH + "</p>" +
              '<p class="queue-summary__label">' + f.label + "</p></article>";
          }).join("");
          return '<section class="queue-summary" aria-label="Queue summary"><div class="queue-summary__grid">' + tiles + "</div></section>";
        }

        function queueFooter() {
          return (
            '<footer class="queue-footer" data-region="queue-footer">' +
            '<span class="queue-footer__counts">Showing <span data-field="displayedCount">' + PH +
            '</span> of <span data-field="totalCount">' + PH + "</span> cases</span>" +
            '<span class="queue-footer__status" data-field="queueStatus">' + PH + "</span></footer>"
          );
        }

        function queueScreen(presentation) {
          return (
            '<div class="queue" data-screen="investigation-queue" data-presentation="' + presentation + '">' +
            queueHeader() + queueSummary() + queueList(presentation) + queueFooter() + "</div>"
          );
        }

        function sectionLabel(text) {
          return '<p style="max-width:1100px;margin:24px auto 4px;padding:0 24px;font-size:12px;' +
            'text-transform:uppercase;letter-spacing:0.6px;color:#5b6b7c;">' + text + "</p>";
        }

        function boot() {
          var outlet = document.getElementById("screen-outlet");
          if (!outlet) return;
          outlet.innerHTML =
            sectionLabel("State 1 — Ready (placeholder rows)") + queueScreen("ready") +
            sectionLabel("State 2 — Empty") + queueScreen("empty") +
            sectionLabel("State 3 — Loading") + queueScreen("loading");
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        } else { boot(); }
      })();
    </script>
    <!--
      To run the REAL modular app (index.html), serve the PayResolveAI
      folder over http, e.g.:  python3 -m http.server 8000
    -->
  </body>
</html>
